name: Bootstrap companion package

on:
  workflow_dispatch:
    inputs:
      package:
        description: New companion package to publish for the first time
        required: true
        type: choice
        options:
          - cli
          - source-testkit
          - watch
      confirmation:
        description: Type bootstrap to confirm one-time token use
        required: true
        type: string

concurrency:
  group: npm-companion-${{ inputs.package }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Verify and prepare new ${{ inputs.package }} package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KASANE_COMPANION_PACKAGE: ${{ inputs.package }}
      BOOTSTRAP_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Require explicit bootstrap confirmation
        run: test "$BOOTSTRAP_CONFIRMATION" = bootstrap
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm companion:release:pack
      - run: pnpm companion:release:rehearse
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: companion-bootstrap-${{ inputs.package }}-${{ github.run_id }}
          path: artifacts/companions/*.tgz
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Bootstrap ${{ inputs.package }} on npm
    needs: prepare
    environment: npm-companions
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KASANE_COMPANION_PACKAGE: ${{ inputs.package }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: companion-bootstrap-${{ inputs.package }}-${{ github.run_id }}
          path: artifacts/companions
      - name:
          Publish the package for the first and only token-authenticated time
        run: pnpm companion:release:bootstrap-publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
      - name: Verify the published artifact without bootstrap credentials
        run: pnpm companion:release:published-check
        env:
          # setup-node sets a non-secret placeholder when registry-url is used.
          NODE_AUTH_TOKEN: ''
      - name: Require credential cleanup
        if: always()
        run:
          echo "::notice::Revoke the npm bootstrap token and delete
          NPM_BOOTSTRAP_TOKEN before configuring trusted publishing."

  registry-smoke:
    name: Bootstrap registry smoke / Node.js ${{ matrix.node-version }}
    needs: publish
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KASANE_COMPANION_PACKAGE: ${{ inputs.package }}
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.x
          - 24.x
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - run: pnpm companion:release:registry-smoke
