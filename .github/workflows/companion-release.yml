name: Publish companion package

on:
  workflow_dispatch:
    inputs:
      package:
        description: Companion package to publish
        required: true
        type: choice
        options:
          - cli
          - source-testkit
          - watch

concurrency:
  group: npm-companion-${{ inputs.package }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Verify and prepare ${{ inputs.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KASANE_COMPANION_PACKAGE: ${{ inputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm companion:release:pack
      - run: pnpm companion:release:rehearse
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: companion-${{ inputs.package }}-${{ github.run_id }}
          path: artifacts/companions/*.tgz
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish ${{ inputs.package }} to npm
    needs: prepare
    environment: npm-companions
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KASANE_COMPANION_PACKAGE: ${{ inputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: companion-${{ inputs.package }}-${{ github.run_id }}
          path: artifacts/companions
      - run: pnpm companion:release:publish
      - run: pnpm companion:release:published-check

  registry-smoke:
    name: Companion registry smoke / Node.js ${{ matrix.node-version }}
    needs: publish
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KASANE_COMPANION_PACKAGE: ${{ inputs.package }}
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.x
          - 24.x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm companion:release:registry-smoke
