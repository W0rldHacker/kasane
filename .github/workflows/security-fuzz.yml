name: Security and fuzz

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'
      - 'prerelease/**'
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Security gate
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - if: github.event_name != 'schedule'
        run: pnpm test:security
      - if: github.event_name == 'schedule'
        run: pnpm test:fuzz:nightly
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: warn
          name: minimized-fuzz-corpus-${{ github.run_id }}
          path: test/fuzz-corpus/generated/last-failure.json
